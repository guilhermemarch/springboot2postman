name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
        env:
          NODE_OPTIONS: --experimental-vm-modules

      - name: Smoke test against fixture corpus
        run: |
          node cli/index.js generate --project tests/fixtures/shop-api --format openapi --out /tmp/smoke.json --strict --seed 1
          node cli/index.js diff --project tests/fixtures/shop-api --against /tmp/smoke.json
